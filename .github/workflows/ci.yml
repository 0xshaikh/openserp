name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Test (offline — network is monkeypatched)
        run: pytest -q
      - name: CLI smoke test (help only, no network)
        run: |
          openserp --help
          openserp --version
          openserp audit --help
          openserp keywords --help
          openserp rank --help
          openserp rank history --help
          openserp backlinks --help
          openserp compete --help
          openserp serve --help
      - name: Rubric integrity guard
        run: |
          python -c "import openserp; assert sum(w for w, *_ in openserp.RUBRIC.values()) == 100, 'rubric weights must sum to 100'"
