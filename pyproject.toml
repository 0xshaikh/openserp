[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# `openserp.py` is a single-module project sitting in a flat layout next to
# `tests/` and `tools/` directories. Without this declaration setuptools'
# auto-discovery does not pick the module up, the wheel ships no code, and the
# installed `openserp` console script dies with `ModuleNotFoundError: No module
# named 'openserp'`. CI caught this; tests stayed green because pytest gets the
# repo root from [tool.pytest.ini_options] pythonpath.
[tool.setuptools]
py-modules = ["openserp"]

[project]
name = "openserp"
version = "0.1.0"
description = "Open-source SEO research & site-audit toolkit: real crawls, keyword expansion, rank tracking and best-effort backlink discovery. No mocked data."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Anas Shaikh", email = "0xshaikh@users.noreply.github.com"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Marketing",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Topic :: Utilities",
]
keywords = ["seo", "audit", "keywords", "rank-tracking", "backlinks", "crawler", "cli"]

dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "rich>=13.0",
    "click>=8.1",
]

[project.optional-dependencies]
serve = ["flask>=3.0"]
dev = ["pytest>=8.0"]

[project.scripts]
openserp = "openserp:main"

[project.urls]
Homepage = "https://github.com/0xshaikh/openserp"
Issues = "https://github.com/0xshaikh/openserp/issues"

[tool.pytest.ini_options]
# `openserp` is a single-module package, so make the repo root importable.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
