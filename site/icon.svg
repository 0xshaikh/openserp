<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#ef4444"/>
    </linearGradient>
  </defs>
  
  <!-- Rounded Background -->
  <rect width="100" height="100" rx="20" ry="20" fill="url(#bg)"/>
  
  <!-- Search/Magnifying Glass -->
  <circle cx="42" cy="42" r="18" fill="none" stroke="white" stroke-width="5"/>
  
  <!-- Handle -->
  <line x1="55" y1="55" x2="70" y2="70" stroke="white" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Bar Chart inside (SEO ranks) -->
  <rect x="36" y="45" width="4" height="10" fill="url(#accent)"/>
  <rect x="42" y="40" width="4" height="15" fill="url(#accent)"/>
  <rect x="48" y="35" width="4" height="20" fill="url(#accent)"/>
  
  <!-- Sparkle effect -->
  <circle cx="20" cy="20" r="2" fill="white" opacity="0.6"/>
  <circle cx="80" cy="80" r="2" fill="white" opacity="0.6"/>
  <circle cx="85" cy="25" r="1.5" fill="white" opacity="0.4"/>
  <circle cx="25" cy="85" r="1.5" fill="white" opacity="0.4"/>
</svg>